<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HORECA SMART — Score Cards of the Week</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-page: #f4f7fb;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --border: #e2e8f0;
      --good-bg: #dcfce7;
      --good-text: #15803d;
      --bad-bg: #fee2e2;
      --bad-text: #b91c1c;
      --neutral-bg: #f1f5f9;
      --neutral-text: #475569;
    }

    body.dark {
      --bg-page: #0b1120;
      --bg-card: #111827;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --good-bg: rgba(21, 128, 61, 0.22);
      --good-text: #4ade80;
      --bad-bg: rgba(185, 28, 28, 0.22);
      --bad-text: #f87171;
      --neutral-bg: rgba(71, 85, 105, 0.25);
      --neutral-text: #cbd5e1;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      padding: 20px;
      direction: ltr;
      text-align: left;
    }

    .container { max-width: 1380px; margin: 0 auto; }

    .header-card, .filter-bar, .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* إخفاء أي عنصر خاص بفلتر الشركة نهائياً */
    #company-filter, #companyFilter, .company-filter-box, [data-company-filter] {
      display: none !important;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 14px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .kpi-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .kpi-title { font-weight: 700; font-size: 0.98rem; }
    .kpi-sub { color: var(--text-muted); font-size: 0.78rem; margin-top: 2px; }

    .kpi-value-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .kpi-value {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--primary);
    }

    .trend-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .trend-good { background: var(--good-bg); color: var(--good-text); }
    .trend-bad { background: var(--bad-bg); color: var(--bad-text); }
    .trend-neutral { background: var(--neutral-bg); color: var(--neutral-text); }

    .kpi-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border);
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-card">
      <div class="header-top">
        <div>
          <h2 style="margin:0;">Score Cards of the Week</h2>
          <div style="color:var(--text-muted); font-size:0.88rem;">HORECA SMART — Direct Supabase Integration (All Companies Unified)</div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="loadScorecard()">Refresh Live Data</button>
          <button class="btn" onclick="document.body.classList.toggle('dark')">Dark Mode</button>
        </div>
      </div>
    </div>

    <div class="filter-bar">
      <label>From: <input type="date" id="dateFrom" class="btn" onchange="loadScorecard()" /></label>
      <label>To: <input type="date" id="dateTo" class="btn" onchange="loadScorecard()" /></label>
      <button class="btn" onclick="clearDates()">Clear Dates</button>
      <span id="statusText" style="margin-left:auto; color:var(--text-muted); font-size:0.85rem;">Loading...</span>
    </div>

    <div class="tabs" id="sectionTabs">
      <button class="tab-btn active" data-sec="all" onclick="setSection('all', this)">All Sections</button>
      <button class="tab-btn" data-sec="finance" onclick="setSection('finance', this)">1. Finance</button>
      <button class="tab-btn" data-sec="collection" onclick="setSection('collection', this)">2. Collection</button>
      <button class="tab-btn" data-sec="sales" onclick="setSection('sales', this)">3. Sales</button>
      <button class="tab-btn" data-sec="purchase" onclick="setSection('purchase', this)">4. Purchase</button>
      <button class="tab-btn" data-sec="logistics" onclick="setSection('logistics', this)">5. Logistics</button>
      <button class="tab-btn" data-sec="marketing_cs" onclick="setSection('marketing_cs', this)">6 & 7. Marketing & CS</button>
    </div>

    <div class="section-card" id="sec-finance">
      <h3 style="margin-top:0;">1. Finance</h3>
      <div class="grid" id="financeGrid"></div>
    </div>

    <div class="section-card" id="sec-collection">
      <h3 style="margin-top:0;">2. Collection</h3>
      <div class="grid" id="collectionGrid"></div>
    </div>

    <div class="section-card" id="sec-sales">
      <h3 style="margin-top:0;">3. Sales</h3>
      <div class="grid" id="salesGrid"></div>
    </div>

    <div class="section-card" id="sec-purchase">
      <h3 style="margin-top:0;">4. Purchase</h3>
      <div class="grid" id="purchaseGrid"></div>
    </div>

    <div class="section-card" id="sec-logistics">
      <h3 style="margin-top:0;">5. Logistics</h3>
      <div class="grid" id="logisticsGrid"></div>
    </div>

    <div class="section-card" id="sec-marketing_cs">
      <h3 style="margin-top:0;">6 & 7. Marketing & CS</h3>
      <div class="grid" id="marketingCsGrid"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://zezuokldvfwixzqgzfot.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplenVva2xkdmZ3aXh6cWd6Zm90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3OTMzMzksImV4cCI6MjExMTM2OTMzOX0.pxm-APp3U3v88a06vpeh7Ca9PDq0xjvyivPha7vEW-0";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const SECTIONS = ["finance", "collection", "sales", "purchase", "logistics", "marketing_cs"];

    // الأرقام المحسوبة المستخرجة من PDF (Weekly Meeting 21-11-2026) كمرجع للمقارنة
    const PREV_BENCHMARKS = {
      // 1. Finance
      total_payable_local: 29000000,         // 29 M
      total_receivable_gl: 65400000,         // 65.4 M
      pending_custodies_gl: 1600000,         // 1.6 M
      pending_loans_gl: 1700000,             // 1.7 M
      unreconciled_bills_count: 0,           // 0
      unreconciled_invoices_count: 69,       // 69
      orders_to_invoice_before_today: 141,   // 141
      invoicing_after_11am_pct: 47,          // 47%
      invoicing_over_24h_excl_friday_pct: 7, // 7%
      expenses_budget_over_pct: 160,         // 160%
      cancelled_invoices_count: 0,           // 0

      // 2. Collection
      total_collected_millions: 3.0,         // 3 M
      due_over_60_days_millions: 17.0,       // 17 M
      collection_rate_pct: 68,               // 100% - 32% variance = 68%

      // 3. Sales
      so_total_orders: 268,                  // 54 MAS + 214 Horeca
      so_total_gmv_millions: 8.5,            // 4.9 M MAS + 3.6 M Horeca
      invoiced_orders_count: 268,
      avg_order_value_k: 31.7,

      // 4. Purchase
      purchase_orders_count: 43,             // 43 PO
      purchase_total_millions: 3.9,          // NearExpire / PO spend ref
      open_rfq_count: 10,                    // 10 PO variance
      vendor_bills_count: 43,

      // 5. Logistics
      delivered_orders_count: 498,           // 498 delivered
      pending_deliveries_count: 23,          // 23 orders to validate
      on_time_delivery_pct: 45.4,            // 45.4% On Time
      delayed_shipments_count: 272,          // 236 + 36 delayed

      // 6 & 7. Marketing & CS
      leads_opportunities_count: 262,        // 262 registered in sheet
      won_deals_count: 35,                   // 35 orders
      open_tickets_count: 20,                // 20 open tickets
      csat_score_pct: 87.6                   // 141 / 161 resolved = 87.6%
    };

    // دالة اختصار المبالغ المالية لأقرب قيمة (مثال: 29,000,000 -> 29M | 26,554,768 -> 26.6M | 206,561 -> 206.6K)
    function fmtMoneyShort(val, withCurrency = true) {
      const n = Number(val ?? 0);
      const abs = Math.abs(n);
      const sign = n < 0 ? "-" : "";
      let formatted = "";

      if (abs >= 1_000_000) {
        const m = Math.round((abs / 1_000_000) * 10) / 10;
        formatted = `${sign}${Number.isInteger(m) ? m.toFixed(0) : m.toFixed(1)}M`;
      } else if (abs >= 1_000) {
        const k = Math.round((abs / 1_000) * 10) / 10;
        formatted = `${sign}${Number.isInteger(k) ? k.toFixed(0) : k.toFixed(1)}K`;
      } else {
        const r = Math.round(abs * 10) / 10;
        formatted = `${sign}${Number.isInteger(r) ? r.toFixed(0) : r.toFixed(1)}`;
      }

      return withCurrency ? `${formatted} EGP` : formatted;
    }

    function fmtExactEGP(val) {
      return `${Number(val ?? 0).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })} EGP`;
    }

    function fmtCount(val) {
      return Math.round(Number(val ?? 0)).toLocaleString("en-US");
    }

    function fmtPct(val) {
      const r = Math.round(Number(val ?? 0) * 10) / 10;
      return `${Number.isInteger(r) ? r.toFixed(0) : r.toFixed(1)}%`;
    }

    function formatPrevDisplay(prevVal, unitType) {
      if (unitType === "egp") return fmtMoneyShort(prevVal, false);
      if (unitType === "millions") return `${Number.isInteger(prevVal) ? prevVal.toFixed(0) : prevVal.toFixed(1)}M`;
      if (unitType === "thousands") return `${Number.isInteger(prevVal) ? prevVal.toFixed(0) : prevVal.toFixed(1)}K`;
      if (unitType === "pct") return fmtPct(prevVal);
      return fmtCount(prevVal);
    }

    function renderTrend(currentVal, prevVal, higherIsBetter = false) {
      const curr = Number(currentVal ?? 0);
      const prev = Number(prevVal ?? 0);

      if (Math.abs(curr - prev) < 0.0001) {
        return `<span class="trend-badge trend-neutral">• 0%</span>`;
      }

      const isUp = curr > prev;
      const arrow = isUp ? "▲" : "▼";
      const isGood = higherIsBetter ? isUp : !isUp;
      const cls = isGood ? "trend-good" : "trend-bad";
      const pctRaw = prev !== 0 ? Math.abs(((curr - prev) / Math.abs(prev)) * 100) : 100;
      const pct = `${Math.round(pctRaw)}%`;

      return `<span class="trend-badge ${cls}">${arrow} ${pct}</span>`;
    }

    function cardHtml({ title, sub, valueText, exactTitle = "", currentNum, prevKey, unitType = "count", higherIsBetter, footerText }) {
      const prevVal = PREV_BENCHMARKS[prevKey] ?? 0;
      return `
        <div class="kpi-card" title="${exactTitle}">
          <div class="kpi-top">
            <div>
              <div class="kpi-title">${title}</div>
              <div class="kpi-sub">${sub}</div>
            </div>
            ${renderTrend(currentNum, prevVal, higherIsBetter)}
          </div>
          <div class="kpi-value-row">
            <div class="kpi-value">${valueText}</div>
          </div>
          <div class="kpi-footer">
            <span>${footerText}</span>
            <span>Prev (21/11): ${formatPrevDisplay(prevVal, unitType)}</span>
          </div>
        </div>
      `;
    }

    function setSection(sec, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");

      SECTIONS.forEach(id => {
        const el = document.getElementById(`sec-${id}`);
        if (el) el.style.display = (sec === "all" || sec === id) ? "block" : "none";
      });
    }

    function clearDates() {
      document.getElementById("dateFrom").value = "";
      document.getElementById("dateTo").value = "";
      loadScorecard();
    }

    async function loadScorecard() {
      const statusEl = document.getElementById("statusText");
      statusEl.textContent = "Refreshing live data from Supabase...";

      const p_from = document.getElementById("dateFrom").value || null;
      const p_to = document.getElementById("dateTo").value || null;

      const { data, error } = await sb.rpc("get_scorecard_by_date", {
        p_from,
        p_to,
        p_company: null
      });

      if (error || !data) {
        statusEl.textContent = `Error: ${error?.message || "No data returned"}`;
        return;
      }

      document.getElementById("financeGrid").innerHTML = [
        cardHtml({
          title: "Total Payable",
          sub: `Exact: ${fmtExactEGP(data.total_payable_local)}`,
          valueText: fmtMoneyShort(data.total_payable_local, true),
          exactTitle: fmtExactEGP(data.total_payable_local),
          currentNum: data.total_payable_local,
          prevKey: "total_payable_local",
          unitType: "egp",
          higherIsBetter: false,
          footerText: "Payables Local"
        }),
        cardHtml({
          title: "Total Receivable",
          sub: `Exact: ${fmtExactEGP(data.total_receivable_gl)}`,
          valueText: fmtMoneyShort(data.total_receivable_gl, true),
          exactTitle: fmtExactEGP(data.total_receivable_gl),
          currentNum: data.total_receivable_gl,
          prevKey: "total_receivable_gl",
          unitType: "egp",
          higherIsBetter: true,
          footerText: "Receivable Accounts"
        }),
        cardHtml({
          title: "Pending Custodies",
          sub: `Exact: ${fmtExactEGP(data.pending_custodies_gl)}`,
          valueText: fmtMoneyShort(data.pending_custodies_gl, true),
          exactTitle: fmtExactEGP(data.pending_custodies_gl),
          currentNum: data.pending_custodies_gl,
          prevKey: "pending_custodies_gl",
          unitType: "egp",
          higherIsBetter: false,
          footerText: "Custodies (عهد)"
        }),
        cardHtml({
          title: "Pending Loans",
          sub: `Exact: ${fmtExactEGP(data.pending_loans_gl)}`,
          valueText: fmtMoneyShort(data.pending_loans_gl, true),
          exactTitle: fmtExactEGP(data.pending_loans_gl),
          currentNum: data.pending_loans_gl,
          prevKey: "pending_loans_gl",
          unitType: "egp",
          higherIsBetter: false,
          footerText: "Loans (سلف)"
        }),
        cardHtml({
          title: "Unreconciled Bills",
          sub: "Posted vendor bills with outstanding",
          valueText: fmtCount(data.unreconciled_bills_count),
          currentNum: data.unreconciled_bills_count,
          prevKey: "unreconciled_bills_count",
          unitType: "count",
          higherIsBetter: false,
          footerText: "Vendor Bills"
        }),
        cardHtml({
          title: "Unreconciled Invoices",
          sub: "Posted customer invoices with outstanding",
          valueText: fmtCount(data.unreconciled_invoices_count),
          currentNum: data.unreconciled_invoices_count,
          prevKey: "unreconciled_invoices_count",
          unitType: "count",
          higherIsBetter: false,
          footerText: "Customer Invoices"
        }),
        cardHtml({
          title: "Orders To Invoice",
          sub: "Before today delivery",
          valueText: fmtCount(data.orders_to_invoice_before_today),
          currentNum: data.orders_to_invoice_before_today,
          prevKey: "orders_to_invoice_before_today",
          unitType: "count",
          higherIsBetter: false,
          footerText: "Pending Invoicing"
        }),
        cardHtml({
          title: "Invoicing > 11:00 AM",
          sub: `Count: ${fmtCount(data.invoicing_after_11am_count)}`,
          valueText: fmtPct(data.invoicing_after_11am_pct),
          currentNum: data.invoicing_after_11am_pct,
          prevKey: "invoicing_after_11am_pct",
          unitType: "pct",
          higherIsBetter: false,
          footerText: "After 11:00 AM Rate"
        }),
        cardHtml({
          title: "Invoicing > 24H",
          sub: `Count: ${fmtCount(data.invoicing_over_24h_count)} (Excl. Fri)`,
          valueText: fmtPct(data.invoicing_over_24h_excl_friday_pct),
          currentNum: data.invoicing_over_24h_excl_friday_pct,
          prevKey: "invoicing_over_24h_excl_friday_pct",
          unitType: "pct",
          higherIsBetter: false,
          footerText: "Over 24H Delay"
        }),
        cardHtml({
          title: "Expenses Budget",
          sub: `Actual: ${fmtMoneyShort(data.expenses_actual, true)}`,
          valueText: fmtPct(data.expenses_budget_over_pct),
          exactTitle: fmtExactEGP(data.expenses_actual),
          currentNum: data.expenses_budget_over_pct,
          prevKey: "expenses_budget_over_pct",
          unitType: "pct",
          higherIsBetter: false,
          footerText: "Expenses vs Budget"
        }),
        cardHtml({
          title: "Cancelled Invoices",
          sub: "State = cancel",
          valueText: fmtCount(data.cancelled_invoices_count),
          currentNum: data.cancelled_invoices_count,
          prevKey: "cancelled_invoices_count",
          unitType: "count",
          higherIsBetter: false,
          footerText: "Cancelled Docs"
        })
      ].join("");

      document.getElementById("collectionGrid").innerHTML = [
        cardHtml({
          title: "Total Collected",
          sub: "Posted out_invoice collected",
          valueText: `${Number(data.total_collected_millions ?? 0).toFixed(1)}M EGP`,
          currentNum: data.total_collected_millions,
          prevKey: "total_collected_millions",
          unitType: "millions",
          higherIsBetter: true,
          footerText: "Collected Amount"
        }),
        cardHtml({
          title: "Due Over 60 Days",
          sub: "Residual balance > 60 days",
          valueText: `${Number(data.due_over_60_days_millions ?? 0).toFixed(1)}M EGP`,
          currentNum: data.due_over_60_days_millions,
          prevKey: "due_over_60_days_millions",
          unitType: "millions",
          higherIsBetter: false,
          footerText: "Overdue > 60d"
        }),
        cardHtml({
          title: "Collection Rate",
          sub: "Collected vs overdue ratio",
          valueText: fmtPct(data.collection_rate_pct),
          currentNum: data.collection_rate_pct,
          prevKey: "collection_rate_pct",
          unitType: "pct",
          higherIsBetter: true,
          footerText: "Collection Eff."
        })
      ].join("");

      document.getElementById("salesGrid").innerHTML = [
        cardHtml({
          title: "Total Sales Orders",
          sub: "State in (sale, done)",
          valueText: fmtCount(data.so_total_orders),
          currentNum: data.so_total_orders,
          prevKey: "so_total_orders",
          unitType: "count",
          higherIsBetter: true,
          footerText: "Sales Orders"
        }),
        cardHtml({
          title: "Total GMV",
          sub: "Sales orders gross value",
          valueText: `${Number(data.so_total_gmv_millions ?? 0).toFixed(1)}M EGP`,
          currentNum: data.so_total_gmv_millions,
          prevKey: "so_total_gmv_millions",
          unitType: "millions",
          higherIsBetter: true,
          footerText: "Gross Sales"
        }),
        cardHtml({
          title: "Invoiced Orders",
          sub: "Invoice status = invoiced",
          valueText: fmtCount(data.invoiced_orders_count),
          currentNum: data.invoiced_orders_count,
          prevKey: "invoiced_orders_count",
          unitType: "count",
          higherIsBetter: true,
          footerText: "Billed Orders"
        }),
        cardHtml({
          title: "Average Order Value",
          sub: "GMV per sales order",
          valueText: `${Number(data.avg_order_value_k ?? 0).toFixed(1)}K EGP`,
          currentNum: data.avg_order_value_k,
          prevKey: "avg_order_value_k",
          unitType: "thousands",
          higherIsBetter: true,
          footerText: "AOV"
        })
      ].join("");

      document.getElementById("purchaseGrid").innerHTML = [
        cardHtml({
          title: "Purchase Orders",
          sub: "Confirmed POs • HORECA + MAS",
          valueText: fmtCount(data.purchase_orders_count),
          currentNum: data.purchase_orders_count,
          prevKey: "purchase_orders_count",
          unitType: "count",
          higherIsBetter: true,
          footerText: "Purchase Orders"
        }),
        cardHtml({
          title: "Purchase Spend",
          sub: "Total PO value",
          valueText: `${Number(data.purchase_total_millions ?? 0).toFixed(1)}M EGP`,
          currentNum: data.purchase_total_millions,
          prevKey: "purchase_total_millions",
          unitType: "millions",
          higherIsBetter: false,
          footerText: "Spend"
        }),
        cardHtml({
          title: "Open RFQs",
          sub: "Pending vendor quotations",
          valueText: fmtCount(data.open_rfq_count),
          currentNum: data.open_rfq_count,
          prevKey: "open_rfq_count",
          unitType: "count",
