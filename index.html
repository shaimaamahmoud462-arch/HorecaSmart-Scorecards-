<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HORECA SMART — Score Cards of the Week</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-page: #f4f7fb;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --border: #e2e8f0;
      --good-bg: #dcfce7;
      --good-text: #15803d;
      --bad-bg: #fee2e2;
      --bad-text: #b91c1c;
      --neutral-bg: #f1f5f9;
      --neutral-text: #475569;
    }

    body.dark {
      --bg-page: #0b1120;
      --bg-card: #111827;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --good-bg: rgba(21, 128, 61, 0.22);
      --good-text: #4ade80;
      --bad-bg: rgba(185, 28, 28, 0.22);
      --bad-text: #f87171;
      --neutral-bg: rgba(71, 85, 105, 0.25);
      --neutral-text: #cbd5e1;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      padding: 20px;
      direction: ltr;
      text-align: left;
    }

    .container { max-width: 1360px; margin: 0 auto; }

    .header-card, .filter-bar, .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* إخفاء أي عنصر خاص بفلتر الشركة نهائياً */
    #company-filter, #companyFilter, .company-filter-box, [data-company-filter] {
      display: none !important;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 14px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .kpi-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .kpi-title { font-weight: 700; font-size: 0.98rem; }
    .kpi-sub { color: var(--text-muted); font-size: 0.78rem; margin-top: 2px; }

    .kpi-value-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .kpi-value {
      font-size: 1.42rem;
      font-weight: 800;
      color: var(--primary);
    }

    .trend-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .trend-good { background: var(--good-bg); color: var(--good-text); }
    .trend-bad { background: var(--bad-bg); color: var(--bad-text); }
    .trend-neutral { background: var(--neutral-bg); color: var(--neutral-text); }

    .kpi-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border);
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-card">
      <div class="header-top">
        <div>
          <h2 style="margin:0;">Score Cards of the Week</h2>
          <div style="color:var(--text-muted); font-size:0.88rem;">HORECA SMART — Direct Supabase Integration (All Companies Unified)</div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="loadScorecard()">Refresh Live Data</button>
          <button class="btn" onclick="document.body.classList.toggle('dark')">Dark Mode</button>
        </div>
      </div>
    </div>

    <div class="filter-bar">
      <label>From: <input type="date" id="dateFrom" class="btn" onchange="loadScorecard()" /></label>
      <label>To: <input type="date" id="dateTo" class="btn" onchange="loadScorecard()" /></label>
      <button class="btn" onclick="clearDates()">Clear Dates</button>
      <span id="statusText" style="margin-left:auto; color:var(--text-muted); font-size:0.85rem;">Loading...</span>
    </div>

    <div class="tabs" id="sectionTabs">
      <button class="tab-btn active" data-sec="all" onclick="setSection('all', this)">All Sections</button>
      <button class="tab-btn" data-sec="finance" onclick="setSection('finance', this)">1. Finance</button>
      <button class="tab-btn" data-sec="collection" onclick="setSection('collection', this)">2. Collection</button>
      <button class="tab-btn" data-sec="sales" onclick="setSection('sales', this)">3. Sales</button>
    </div>

    <div class="section-card" id="sec-finance">
      <h3 style="margin-top:0;">1. Finance</h3>
      <div class="grid" id="financeGrid"></div>
    </div>

    <div class="section-card" id="sec-collection">
      <h3 style="margin-top:0;">2. Collection</h3>
      <div class="grid" id="collectionGrid"></div>
    </div>

    <div class="section-card" id="sec-sales">
      <h3 style="margin-top:0;">3. Sales</h3>
      <div class="grid" id="salesGrid"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://zezuokldvfwixzqgzfot.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplenVva2xkdmZ3aXh6cWd6Zm90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3OTMzMzksImV4cCI6MjExMTM2OTMzOX0.pxm-APp3U3v88a06vpeh7Ca9PDq0xjvyivPha7vEW-0";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // higherIsBetter: true = زيادة الرقم خضراء ونقصانه أحمر | false = زيادة الرقم حمراء ونقصانه أخضر
    const PREV_BENCHMARKS = {
      total_payable_local: 25800000,
      total_receivable_gl: 68700000,
      pending_custodies_gl: 1700000,
      pending_loans_gl: 1700000,
      unreconciled_bills_count: 0,
      unreconciled_invoices_count: 17,
      orders_to_invoice_before_today: 12,
      invoicing_after_11am_pct: 75,
      invoicing_over_24h_excl_friday_pct: 12,
      expenses_budget_over_pct: 101,
      cancelled_invoices_count: 580,
      total_collected_millions: 14.5,
      due_over_60_days_millions: 2.1,
      so_total_orders: 1200,
      so_total_gmv_millions: 85.0
    };

    function fmtNum(val, decimals = 2) {
      const n = Number(val ?? 0);
      return n.toLocaleString("en-US", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function fmtEGP(val) {
      return `${fmtNum(val, 2)} EGP`;
    }

    function renderTrend(currentVal, prevVal, higherIsBetter = false) {
      const curr = Number(currentVal ?? 0);
      const prev = Number(prevVal ?? 0);

      if (curr === prev) {
        return `<span class="trend-badge trend-neutral">• 0.0%</span>`;
      }

      const isUp = curr > prev;
      const arrow = isUp ? "▲" : "▼";
      const isGood = higherIsBetter ? isUp : !isUp;
      const cls = isGood ? "trend-good" : "trend-bad";
      const pct = prev !== 0 ? `${Math.abs(((curr - prev) / Math.abs(prev)) * 100).toFixed(1)}%` : "New";

      return `<span class="trend-badge ${cls}">${arrow} ${pct}</span>`;
    }

    function cardHtml({ title, sub, valueText, currentNum, prevKey, higherIsBetter, footerText }) {
      const prevVal = PREV_BENCHMARKS[prevKey] ?? 0;
      return `
        <div class="kpi-card">
          <div class="kpi-top">
            <div>
              <div class="kpi-title">${title}</div>
              <div class="kpi-sub">${sub}</div>
            </div>
            ${renderTrend(currentNum, prevVal, higherIsBetter)}
          </div>
          <div class="kpi-value-row">
            <div class="kpi-value">${valueText}</div>
          </div>
          <div class="kpi-footer">
            <span>${footerText}</span>
            <span>Prev: ${fmtNum(prevVal, prevVal % 1 === 0 ? 0 : 2)}</span>
          </div>
        </div>
      `;
    }

    function setSection(sec, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");

      ["finance", "collection", "sales"].forEach(id => {
        const el = document.getElementById(`sec-${id}`);
        el.style.display = (sec === "all" || sec === id) ? "block" : "none";
      });
    }

    function clearDates() {
      document.getElementById("dateFrom").value = "";
      document.getElementById("dateTo").value = "";
      loadScorecard();
    }

    async function loadScorecard() {
      const statusEl = document.getElementById("statusText");
      statusEl.textContent = "Refreshing live data from Supabase...";

      const p_from = document.getElementById("dateFrom").value || null;
      const p_to = document.getElementById("dateTo").value || null;

      const { data, error } = await sb.rpc("get_scorecard_by_date", {
        p_from,
        p_to,
        p_company: null
      });

      if (error || !data) {
        statusEl.textContent = `Error: ${error?.message || "No data returned"}`;
        return;
      }

      document.getElementById("financeGrid").innerHTML = [
        cardHtml({
          title: "Total Payable",
          sub: "Payables Local • HORECA + MAS",
          valueText: fmtEGP(data.total_payable_local),
          currentNum: data.total_payable_local,
          prevKey: "total_payable_local",
          higherIsBetter: false,
          footerText: "Payables (Up = Red)"
        }),
        cardHtml({
          title: "Total Receivable",
          sub: "Receivable Accounts • HORECA + MAS",
          valueText: fmtEGP(data.total_receivable_gl),
          currentNum: data.total_receivable_gl,
          prevKey: "total_receivable_gl",
          higherIsBetter: true,
          footerText: "Receivable (Up = Green)"
        }),
        cardHtml({
          title: "Pending Custodies",
          sub: "Custodies (عهد) • HORECA + MAS",
          valueText: fmtEGP(data.pending_custodies_gl),
          currentNum: data.pending_custodies_gl,
          prevKey: "pending_custodies_gl",
          higherIsBetter: false,
          footerText: "Custodies (Up = Red)"
        }),
        cardHtml({
          title: "Pending Loans",
          sub: "Loans (سلف) • HORECA + MAS",
          valueText: fmtEGP(data.pending_loans_gl),
          currentNum: data.pending_loans_gl,
          prevKey: "pending_loans_gl",
          higherIsBetter: false,
          footerText: "Loans (Up = Red)"
        }),
        cardHtml({
          title: "Unreconciled Bills",
          sub: "Posted vendor bills with outstanding",
          valueText: fmtNum(data.unreconciled_bills_count, 0),
          currentNum: data.unreconciled_bills_count,
          prevKey: "unreconciled_bills_count",
          higherIsBetter: false,
          footerText: "Vendor Bills"
        }),
        cardHtml({
          title: "Unreconciled Invoices",
          sub: "Posted customer invoices with outstanding",
          valueText: fmtNum(data.unreconciled_invoices_count, 0),
          currentNum: data.unreconciled_invoices_count,
          prevKey: "unreconciled_invoices_count",
          higherIsBetter: false,
          footerText: "Customer Invoices"
        }),
        cardHtml({
          title: "Orders To Invoice",
          sub: "Before today delivery",
          valueText: fmtNum(data.orders_to_invoice_before_today, 0),
          currentNum: data.orders_to_invoice_before_today,
          prevKey: "orders_to_invoice_before_today",
          higherIsBetter: false,
          footerText: "Pending Invoicing"
        }),
        cardHtml({
          title: "Invoicing > 11:00 AM",
          sub: `Count: ${fmtNum(data.invoicing_after_11am_count, 0)}`,
          valueText: `${fmtNum(data.invoicing_after_11am_pct, 2)}%`,
          currentNum: data.invoicing_after_11am_pct,
          prevKey: "invoicing_after_11am_pct",
          higherIsBetter: false,
          footerText: "After 11:00 AM Rate"
        }),
        cardHtml({
          title: "Invoicing > 24H",
          sub: `Count: ${fmtNum(data.invoicing_over_24h_count, 0)} (Excl. Fri)`,
          valueText: `${fmtNum(data.invoicing_over_24h_excl_friday_pct, 2)}%`,
          currentNum: data.invoicing_over_24h_excl_friday_pct,
          prevKey: "invoicing_over_24h_excl_friday_pct",
          higherIsBetter: false,
          footerText: "Over 24H Delay"
        }),
        cardHtml({
          title: "Expenses Budget",
          sub: `Actual: ${fmtEGP(data.expenses_actual)}`,
          valueText: `${fmtNum(data.expenses_budget_over_pct, 2)}%`,
          currentNum: data.expenses_budget_over_pct,
          prevKey: "expenses_budget_over_pct",
          higherIsBetter: false,
          footerText: "Expenses vs Budget"
        }),
        cardHtml({
          title: "Cancelled Invoices",
          sub: "State = cancel",
          valueText: fmtNum(data.cancelled_invoices_count, 0),
          currentNum: data.cancelled_invoices_count,
          prevKey: "cancelled_invoices_count",
          higherIsBetter: false,
          footerText: "Cancelled Docs"
        })
      ].join("");

      document.getElementById("collectionGrid").innerHTML = [
        cardHtml({
          title: "Total Collected",
          sub: "Posted out_invoice collected",
          valueText: `${fmtNum(data.total_collected_millions, 2)}M EGP`,
          currentNum: data.total_collected_millions,
          prevKey: "total_collected_millions",
          higherIsBetter: true,
          footerText: "Collected (Up = Green)"
        }),
        cardHtml({
          title: "Due Over 60 Days",
          sub: "Residual balance > 60 days",
          valueText: `${fmtNum(data.due_over_60_days_millions, 2)}M EGP`,
          currentNum: data.due_over_60_days_millions,
          prevKey: "due_over_60_days_millions",
          higherIsBetter: false,
          footerText: "Overdue > 60d (Up = Red)"
        })
      ].join("");

      document.getElementById("salesGrid").innerHTML = [
        cardHtml({
          title: "Total Sales Orders",
          sub: "State in (sale, done)",
          valueText: fmtNum(data.so_total_orders, 0),
          currentNum: data.so_total_orders,
          prevKey: "so_total_orders",
          higherIsBetter: true,
          footerText: "Sales Orders (Up = Green)"
        }),
        cardHtml({
          title: "Total GMV",
          sub: "Sales orders gross value",
          valueText: `${fmtNum(data.so_total_gmv_millions, 2)}M EGP`,
          currentNum: data.so_total_gmv_millions,
          prevKey: "so_total_gmv_millions",
          higherIsBetter: true,
          footerText: "Gross Sales (Up = Green)"
        })
      ].join("");

      statusEl.textContent = `Last updated: ${new Date().toLocaleTimeString("en-US")}`;
    }

    loadScorecard();
  </script>
</body>
</html>
